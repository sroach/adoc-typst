[package]
name = "adoc-typst"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "adoc-typst"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
asciidoc-parser = "0.31.2"
reqwest = { version = "0.12", features = ["gzip", "blocking"] }
flate2 = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
