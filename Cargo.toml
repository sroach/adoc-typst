[package]
name = "adoc-typst"
version = "0.1.5"
edition = "2024"

[[bin]]
name = "adoc-typst"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
asciidoc-parser = "0.31.2"
reqwest = { version = "0.13.5", features = ["gzip", "blocking"] }
flate2 = "1"
base64 = "0.23.1"
chrono = "0.4"
